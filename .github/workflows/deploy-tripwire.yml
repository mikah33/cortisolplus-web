name: Deploy tripwire (repository versus live)
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare intended release to production
        run: npm run verify:live
      - name: Detect stale or failed Google reporting
        if: always()
        run: node scripts/check-seo-freshness.mjs
