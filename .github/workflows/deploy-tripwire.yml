name: Deploy tripwire (live-content check)

# Guards against the exact failure this project already hit once: the content
# automation kept committing posts, but the live site silently went stale and
# 18 posts 404'd for weeks. This job fetches the live sitemap and verifies the
# newest blog URLs actually return 200 on production. If any fail, the workflow
# fails — GitHub emails the repo owner.

on:
  schedule:
    - cron: '0 13 * * *'   # daily 13:00 UTC (~9 AM ET)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify newest live URLs return 200
        run: |
          set -euo pipefail
          BASE="https://cortisolplus.com"

          echo "Checking homepage + sitemap…"
          for u in "/" "/sitemap.xml"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$u")
            echo "  $code  $u"
            [ "$code" = "200" ] || { echo "::error::$BASE$u returned $code"; exit 1; }
          done

          echo "Fetching sitemap and checking the 5 newest blog URLs…"
          curl -s "$BASE/sitemap.xml" \
            | grep -oE '<loc>[^<]*/blog/[^<]*</loc>' \
            | sed -E 's#</?loc>##g' \
            | tail -n 5 > urls.txt

          if [ ! -s urls.txt ]; then
            echo "::error::No blog URLs found in sitemap — sitemap may be broken"; exit 1
          fi

          fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "  $code  $url"
            [ "$code" = "200" ] || fail=1
          done < urls.txt

          if [ "$fail" = "1" ]; then
            echo "::error::One or more newest blog URLs are not live (200). The deploy is likely stale."
            exit 1
          fi
          echo "All checks passed — live site is in sync."
