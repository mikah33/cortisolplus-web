name: Deploy to Firebase Hosting

# Auto-deploys the site to Firebase Hosting on every push to main.
# This replaces the old (broken) assumption that a commit triggers a Netlify
# rebuild — the site is hosted on Firebase (project: cortisol-plus), and before
# this workflow existed deploys were manual, so main silently drifted from live.
#
# ONE-TIME SETUP (required before this runs green):
#   Run locally, once:  firebase init hosting:github
#   Pick this repo (mikah33/cortisolplus-web). It provisions a deploy service
#   account and stores its JSON as the GitHub secret referenced below. Or add
#   the secret manually: repo Settings → Secrets → Actions →
#   FIREBASE_SERVICE_ACCOUNT_CORTISOL_PLUS = <service-account JSON>.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CORTISOL_PLUS }}
          projectId: cortisol-plus
          channelId: live
